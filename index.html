<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <script type="module" src="./src/js/main.js" defer></script>
    <title>Cyber Wheel</title>
  </head>
  <body>
    <div class="layout">
      <!-- Header-->
      <header>
        <div class="header-nav">
          <wc-logo></wc-logo>
          <nav>
            <ul>
              <li><a href="/" data-link>Home</a></li>
              <li><a href="/bikes" data-link>Bikes</a></li>
            </ul>
          </nav>
        </div>
        <wc-button icon="lightMode" id="light-mode"></wc-button>
      </header>

      <!-- Main -->
      <main id="app"></main>

      <!-- Footer -->
      <footer>
        <div>
          <span class="display-block margin-bottom bold">CONTACT</span>
          <ul>
            <li><a href="tel:+15551234567">+1 (555) 123-4567</a></li>
            <li>
              <a href="mailto:contact@cyberwheel.com">contact@cyberwheel.com</a>
            </li>
            <li>1234 Cycle Lane</li>
            <li>New York, NY 10001, USA</li>
          </ul>
        </div>
        <div>
          <span class="display-block margin-bottom bold">INFORMATION</span>
          <address>
            <ul>
              <li>Bicycles</li>
              <li>Insurance</li>
              <li>Terms and Condition</li>
            </ul>
          </address>
        </div>
        <div>
          <span class="display-block margin-bottom bold">SOCIAL</span>
          <ul class="footer__social-media">
            <li>
              <a href="#">
                <img src="/images/icons/instagram.svg" alt="instagram icon">
              </a>
            </li>
            <li>
              <a href="#">
                <img src="/images/icons/youtube.svg" alt="youtube icon">
              </a>
            </li>
            <li>
              <a href="#">
                <img src="/images/icons/linkedin.svg" alt="linkedIn icon">
              </a>
            </li>
          </ul>
        </div>
        <span>© Cyber Wheel - All rights reserved</span>
      </footer>
    </div>
  </body>
</html>
